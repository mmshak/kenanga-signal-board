name: Run daily research (reusable)

# The actual research -> verify -> build -> publish pipeline, factored out so
# both the nightly guaranteed run (daily.yml) and the intraday fast-path poll
# (intraday-check.yml) share one copy instead of two drifting ones.

on:
  workflow_call:
    inputs:
      target:
        description: "'previous' (default, the previous trading day) or 'today' (the current Malaysia calendar date)"
        type: string
        default: 'previous'

permissions:
  contents: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The agent researches and writes data/YYYY-MM-DD.json, then stops without
      # committing (see .claude/commands/daily-run.md). Everything after this step
      # re-verifies independently — the agent's own belief that it passed is not the gate.
      - name: Run daily research agent
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/daily-run ${{ inputs.target }}"
          claude_args: '--model opus --allowedTools "Read,Write,Edit,Bash,WebFetch,WebSearch" --max-turns 200'

      - name: Verify (independent gate)
        run: node checks/verify.js

      - name: Build
        run: node scripts/build.js

      - name: Commit and push if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The research-agent step rewrites (and revokes) its own git credential
          # on the remote; reset it here to this job's own token before pushing.
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ dist/ index.html checks/report.json
          if git diff --staged --quiet; then
            echo "No changes — nothing published today (no bundle, holiday, or weekend)."
            exit 0
          fi
          NEW_DATE=$(git diff --staged --name-only -- data/ \
            | grep -E '^data/[0-9]{4}-[0-9]{2}-[0-9]{2}\.json$' \
            | sed -E 's#data/(.*)\.json#\1#' | head -n1)
          git commit -m "Daily update${NEW_DATE:+: $NEW_DATE}"
          # A concurrent run (nightly vs intraday, or two intraday polls) can land
          # a commit in between our checkout and this push. Rebase once and retry
          # rather than fail outright on a simple race.
          git pull --rebase origin main || true
          git push
