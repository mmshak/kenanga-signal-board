name: Daily run

# Tue-Sat 00:00 Malaysia time (UTC+8) = 16:00 UTC Mon-Fri.
# Each run processes the PREVIOUS trading day; see rules/daily-run.md.
# Monday MYT is deliberately excluded — Kenanga publishes nothing for the board to find.
on:
  schedule:
    - cron: '0 16 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write

concurrency:
  group: daily-run
  cancel-in-progress: false

jobs:
  daily-run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The agent researches and writes data/YYYY-MM-DD.json, then stops without
      # committing (see .claude/commands/daily-run.md). Everything after this step
      # re-verifies independently — the agent's own belief that it passed is not the gate.
      - name: Run daily research agent
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: '/daily-run'
          claude_args: '--allowedTools "Read,Write,Edit,Bash,WebFetch,WebSearch" --max-turns 60'

      - name: Verify (independent gate)
        run: node checks/verify.js

      - name: Build
        run: node scripts/build.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ dist/ index.html checks/report.json
          if git diff --staged --quiet; then
            echo "No changes — nothing published today (no bundle, holiday, or weekend)."
            exit 0
          fi
          NEW_DATE=$(git diff --staged --name-only -- data/ \
            | grep -E '^data/[0-9]{4}-[0-9]{2}-[0-9]{2}\.json$' \
            | sed -E 's#data/(.*)\.json#\1#' | head -n1)
          git commit -m "Daily update${NEW_DATE:+: $NEW_DATE}"
          git push
