name: Daily run

# Tue-Sat 00:00 Malaysia time (UTC+8) = 16:00 UTC Mon-Fri.
# This is the guaranteed nightly fallback: it always processes the PREVIOUS
# trading day (see rules/daily-run.md), regardless of what intraday-check.yml
# already caught during the day — if that day's file already exists, the
# reusable workflow's own commit step finds nothing to push and no-ops.
# Monday MYT is deliberately excluded — Kenanga publishes nothing for the board to find.
on:
  schedule:
    - cron: '0 16 * * 1-5'
  workflow_dispatch:
    inputs:
      target:
        description: "'previous' (default) or 'today' — which day's bundle to fetch"
        type: choice
        options: [previous, today]
        default: previous

concurrency:
  group: daily-run
  cancel-in-progress: false

jobs:
  daily-run:
    uses: ./.github/workflows/_run-daily-research.yml
    with:
      target: ${{ inputs.target || 'previous' }}
    secrets: inherit
